<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)">
<title>Apps · Aaron Joseph</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f6bed'/><g fill='white'><rect x='7' y='7' width='7' height='7' rx='2'/><rect x='18' y='7' width='7' height='7' rx='2'/><rect x='7' y='18' width='7' height='7' rx='2'/><rect x='18' y='18' width='7' height='7' rx='2'/></g></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Apps</h1>
      <p>Things I've built.</p>
    </div>
    <span class="spacer"></span>
    <a class="icon-btn" href="/settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off">
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>
</div>

<script type="module">
import { esc, host, iconHtml } from '/common.js'

const grid = document.getElementById('grid')
const q = document.getElementById('q')
let apps = []

const arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>'

function render() {
  const term = q.value.trim().toLowerCase()
  const list = apps.filter((a) => !term || `${a.name} ${a.description} ${a.url}`.toLowerCase().includes(term))
  grid.innerHTML = list.length
    ? list.map((a) => `
      <a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
        ${iconHtml(a)}
        <div class="body">
          <h2>${esc(a.name)}</h2>
          <div class="host">${esc(host(a.url))}</div>
          ${a.description ? `<p class="desc">${esc(a.description)}</p>` : ''}
        </div>
        ${arrow}
      </a>`).join('')
    : `<p class="empty">${apps.length ? 'No apps match your search.' : 'No apps yet.'}</p>`
}

q.addEventListener('input', render)

try {
  apps = await (await fetch('/api/apps')).json()
} catch {
  grid.innerHTML = '<p class="empty">Could not load apps. Try refreshing.</p>'
}
render()
</script>
</body>
</html>
